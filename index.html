<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Salat Tracker</title>
<style>
:root{--bg:#f3f5f6;--card:#fff;--tx:#14201f;--mut:#74817f;--line:#e3e8e8;--ac:#1d6b62;--ac2:#e0eeec;--ok:#1d6b62;--late:#c98a1b;--miss:#c4474f;--sh:0 1px 2px rgba(20,32,31,.05)}
[data-theme=dark]{--bg:#0b1011;--card:#131a1b;--tx:#e8eeed;--mut:#82908e;--line:#1f2929;--ac:#58c2b3;--ac2:#14302d;--ok:#58c2b3;--late:#e5ae4a;--miss:#ec7078;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:22px 4px 8px}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.pad{padding:14px 16px}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav{display:flex;gap:4px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.ib:disabled{opacity:.35}
.pill{padding:8px 14px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:600;font-size:14px}
.next{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.next b{font-size:20px;font-weight:650}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .25s}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.cur .nm b{color:var(--ac)}
.nm b{display:block;font-weight:600}.nm span{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px}
.b{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--mut);transition:.12s}
.b.ontime.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.b.late.on{background:var(--late);border-color:var(--late);color:var(--card)}
.b.missed.on{background:var(--miss);border-color:var(--miss);color:var(--card)}
.legend{display:flex;gap:16px;justify-content:center;margin:12px 0 0;font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px 16px}.stat b{display:block;font-size:28px;font-weight:650;letter-spacing:-.02em}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat i.f{background:transparent}
.heat i.l1{background:color-mix(in srgb,var(--ac) 25%,var(--line))}.heat i.l2{background:color-mix(in srgb,var(--ac) 45%,var(--line))}
.heat i.l3{background:color-mix(in srgb,var(--ac) 65%,var(--line))}.heat i.l4{background:color-mix(in srgb,var(--ac) 85%,var(--line))}.heat i.l5{background:var(--ac)}
.week{display:flex;gap:8px;align-items:flex-end;height:90px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.week i{display:block;background:var(--ac);border-radius:6px;margin-bottom:4px;min-height:4px;opacity:.9}
.qada{display:flex;align-items:center;justify-content:space-between}
.btn{padding:10px 16px;border-radius:12px;background:var(--ac);color:var(--card);font-weight:600}
.btn.sec{background:var(--ac2);color:var(--ac)}.btn.danger{background:transparent;color:var(--miss);border:1px solid var(--line)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:58%}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.tabs button{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--mut)}.tabs button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:var(--sh)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ac)}.sw.on::after{left:21px}
.chk{display:flex;gap:6px;flex-wrap:wrap}.chk button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:var(--mut)}.chk button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:600}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qwrap{display:grid;place-items:center;margin:8px 0}
#dial{width:min(78vw,320px);aspect-ratio:1;position:relative;transition:transform .12s linear}
#dial svg{width:100%;height:100%}
.ptr{position:absolute;top:calc(50% - min(39vw,160px) - 14px);left:50%;width:0;height:0;border:9px solid transparent;border-bottom:16px solid var(--mut);border-top:0;transform:translateX(-50%);transition:.15s}
.ptr.hit{border-bottom-color:var(--ok)}
.qbig{font-size:34px;font-weight:650;text-align:center;letter-spacing:-.02em}
#stop{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);z-index:9;padding:10px 18px;border-radius:99px;background:var(--ac);color:var(--card);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:88vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button id="stop">Stop adhan</button>
<main id="app"></main>
<div id="toast"></div>
<nav><div id="tabs"></div></nav>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
